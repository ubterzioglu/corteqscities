icket - Die einfachste und günstigste Möglichkeit, Bus und Bahn in ganz Deutschlandland zu nutzen. Das Ticket gibt es im monatlich kündbaren Abonnement."},"splashImage":{"id":1256,"name":"Header_Deutschlandticket.de.png","alternativeText":"Deutschlandticket - Die einfachste und günstigste Möglichkeit, Bus und Bahn in ganz Deutschlandland zu nutzen. Das Ticket gibt es im monatlich kündbaren Abonnement.","caption":"Deutschlandticket kaufen ","width":1919,"height":520,"formats":{"large":{"ext":".png","url":"/uploads/large_Header_Deutschlandticket_de_c44c2a1a72.png","hash":"large_Header_Deutschlandticket_de_c44c2a1a72","mime":"image/png","name":"large_Header_Deutschlandticket.de.png","path":null,"size":492.28,"width":1000,"height":271,"sizeInBytes":492280},"small":{"ext":".png","url":"/uploads/small_Header_Deutschlandticket_de_c44c2a1a72.png","hash":"small_Header_Deutschlandticket_de_c44c2a1a72","mime":"image/png","name":"small_Header_Deutschlandticket.de.png","path":null,"size":140.88,"width":500,"height":135,"sizeInBytes":140883},"medium":{"ext":".png","url":"/uploads/medium_Header_Deutschlandticket_de_c44c2a1a72.png","hash":"medium_Header_Deutschlandticket_de_c44c2a1a72","mime":"image/png","name":"medium_Header_Deutschlandticket.de.png","path":null,"size":293.36,"width":750,"height":203,"sizeInBytes":293355},"thumbnail":{"ext":".png","url":"/uploads/thumbnail_Header_Deutschlandticket_de_c44c2a1a72.png","hash":"thumbnail_Header_Deutschlandticket_de_c44c2a1a72","mime":"image/png","name":"thumbnail_Header_Deutschlandticket.de.png","path":null,"size":39.27,"width":245,"height":66,"sizeInBytes":39270}},"hash":"Header_Deutschlandticket_de_c44c2a1a72","ext":".png","mime":"image/png","size":348.26,"url":"/uploads/Header_Deutschlandticket_de_c44c2a1a72.png","previewUrl":null,"provider":"local","provider_metadata":null,"createdAt":"2026-03-10T10:05:21.490Z","updatedAt":"2026-03-17T09:38:05.544Z","documentId":"ibdlvpk4gyyvgz42ttr96jsc","publishedAt":"2026-03-10T10:05:21.490Z","related":[{"__type":"api::landing-page.landing-page","id":562,"pageSubtitle":"Dein Ticket für grenzenlose Flexibilität: Entdecke Städte, Natur und kulturelle Highlights. Ob zum Pendeln für den Arbeitsweg oder Freizeitabenteuer – erlebe beides mit einem Ticket!\nBestell dir in nur wenigen Minuten dein persönliches Deutschlandticket und sei für 63 Euro im Monat bundesweit im öffentlichen Nahverkehr mobil. ","content":"### Deine Vorteile auf Deutschlandticket.de\n- Du kannst das Ticket in nur wenigen Minuten bestellen und direkt nutzen.\n- Bestelle nicht nur für dich, sondern auch für deine [Familie und Freunde](https://wissen.deutschlandticket.de/bestellung-f%C3%BCr-weitere-personen-wie-kinder-oder-freunde). \n- Alles erfolgt digital: Kein Warten auf eine Chipkarte. Die Ticketanzeige erfolgt mit der [Deutschlandticket.de App](https://wissen.deutschlandticket.de/download) oder im [Wallet](https://wissen.deutschlandticket.de/ticketanzeige-in-der-wallet). \n- Eigenständige Verwaltung deines Abonnements im [Kundenkonto](api/identity/account/login). \n- Die [Kündigung](/termination/form) ist schnell und einfach online möglich. \n\n👉 [Jetzt Deutschlandticket abonnieren](/order)\n\u003cbr/\u003e\n________________\n\u003cbr/\u003e\n\n### In welcher Ticketform bekomme ich mein Deutschlandticket?\n- Nutze unsere Deutschlandticket.de App, um dir dein Ticket anzeigen zu lassen. Die Anwendung steht dir im [Google Play Store](https://play.google.com/store/apps/details?id=de.deutschlandticket.app) und[ Apple App Store](https://apps.apple.com/de/app/app-deutschlandticket-de/id1672638598) zum Download zur Verfügung. \n- Mit den Nutzerdaten für dein Kundenkonto, kannst du dich in der Deutschlandticket.de App anmelden. Die Anmeldedaten hast du bei der Bestellung festgelegt. \n\n[![Google Play Store](/uploads/android_app_download_2_882caa6888.png)\n](https://play.google.com/store/apps/details?id=de.deutschlandticket.app)\n[![Apple App Store](/uploads/apple_app_download_2_6a60788dd7.png)](https://apps.apple.com/de/app/app-deutschlandticket-de/id1672638598)\n\n- Sichere dein Ticket ganz einfach in deiner Google oder Apple Wallet auf dem Smartphone. So hast du es immer nur einen Klick entfernt. Öffne unsere E-Mail mit deiner Abobestätigung, klicke auf \"Hinzufügen zu Wallet\" und schon wird es gespeichert.\n- 5 Tage vor Monatswechsel bzw. nach Kauf erhältst du eine Abobestätigung per E-Mail als PDF-Dokument. Das Dokument dient als Zahlungsnachweis für dein Deutschlandticket. Bitte beachte, dass die Abobestätigung nicht als Fahrausweis genutzt werden kann.\n\u003cbr/\u003e\n________________\n\u003cbr/\u003e\n\n### Wie kann ich mein Deutschlandticket kündigen?\nDein Deutschlandticket kannst du monatlich in deinem [Kundenkonto](/api/identity/account/login) kündigen. Die Kündigung muss bis zum 10. Kalendertag erfolgen, um zum Monatsende wirksam zu werden.\nSolltest du aktuell keinen Zugriff auf dein [Kundenkonto](/api/identity/account/login) haben, kannst du unser **[Kündigungsformular](termination/form)** nutzen.\n\u003cbr/\u003e\n________________\n\u003cbr/\u003e\n\n### Deutschlandticket für Touristen – einfach und flexibel durch Deutschland reisen\nEntdecke Deutschland ohne komplizierte Tarife und günstig mit dem Deutschlandticket. Für nur 63 Euro im Monat nutzt du Busse, Bahnen und Regionalzüge im gesamten Nahverkehr deutschlandweit.\n\nPerfekt, wenn du mehrere Städte besuchen und flexibel unterwegs sein möchtest.\n- Unbegrenzt im Nahverkehr in ganz Deutschland fahren\n- Digitales Ticket direkt auf dem Smartphone oder in der Wallet\n- Bezug auch nur für einen Monat bei einer [Kündigung](/termination/form) bis zum 10.\n\n👉 [Jetzt Deutschlandticket kaufen und Deutschland flexibel entdecken](/order)\n\u003cbr/\u003e\n________________\n\u003cbr/\u003e\n\n### Du willst mehr zum Deutschlandticket wissen? \nNutze jetzt unsere [Hilfe](https://wissen.deutschlandticket.de). Hier findest du umfassende Informationen zum Deutschlandticket und deinem Abonnement.\n\u003cbr/\u003e\n________________\n\u003cbr/\u003e\n\n### Du kannst gar nicht genug Deutschlandticket-Content bekommen?\nBesuche uns auf [Instagram](https://www.instagram.com/deutschlandticket.de/) oder schau bei unserem [BLOG](/blog) vorbei.\n\n\u003cbr/\u003e\n________________\n\u003cbr/\u003e\n\n### Du willst keine wichtige Info zum Deutschlandticket verpassen?\nMit unserem Newsletter bekommst du zweimal im Monat hilfreiche Tipps, praktische Tricks und ausgewählte Beiträge rund um das Deutschlandticket – kompakt, verständlich und direkt per E-Mail. [Jetzt kostenlos anmelden](https://news.deutschlandticket.de/f/328048-427812/) \n\n\u003cbr/\u003e\n\nUnseren Deutschlandticket.de Newsletter kannst auch nach dem Versand [online lesen](https://blog.deutschlandticket.de/newsletter). ","createdAt":"2023-05-03T15:13:02.114Z","updatedAt":"2026-06-30T14:02:17.170Z","publishedAt":"2026-06-30T14:02:17.295Z","locale":"de-DE","documentId":"wxwbqz0m1ihlfoytwt37bqzc"}]},"splashImageLogo":null,"pageTitle":{"id":661,"tag":"h1","title":"Deutschlandticket - total digital! "},"orderLinkButton":{"id":596,"title":"Abonniere dir jetzt dein Deutschlandticket! ","link":"/registration"},"imageOrderLinkButton":{"id":595,"title":"Deutschlandticket bestellen ","link":"/order"},"pageSubtitle":"Dein Ticket für grenzenlose Flexibilität: Entdecke Städte, Natur und kulturelle Highlights. Ob zum Pendeln für den Arbeitsweg oder Freizeitabenteuer – erlebe beides mit einem Ticket!\nBestell dir in nur wenigen Minuten dein persönliches Deutschlandticket und sei für 63 Euro im Monat bundesweit im öffentlichen Nahverkehr mobil. ","simpleFlowTitle":{"id":662,"tag":"h2","title":"So einfach bestellst du dir das Deutschlandticket: "},"simpleFlowContent":[{"id":628,"tag":"h3","title":"Bestellung zum Wunschdatum aufgeben","content":"Wähle den gewünschten Monat, ab dem das Deutschlandticket gelten soll. Gib an, für wen du das Ticket bestellst. Hinterlege eine Anschrift für die Rechnung. Nun erstellst du ein Kund
